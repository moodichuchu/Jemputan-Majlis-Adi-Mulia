    <ellipse cx="48" cy="117" rx="8" ry="15" transform="rotate(42 48 117)"/>
    <ellipse cx="48" cy="117" rx="8" ry="15" transform="rotate(90 48 117)"/>
    <circle cx="48" cy="117" r="5" fill="#7a1738" stroke="none"/>
  </g>

  <g transform="translate(91 69)">
