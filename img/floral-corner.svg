    <path d="M66 100C54 87 58 73 70 66C83 78 81 92 66 100Z"/>
    <path d="M83 75C78 58 89 47 104 47C108 63 99 73 83 75Z"/>
    <path d="M100 42C97 27 109 18 124 20C124 34 115 42 100 42Z"/>
    <path d="M55 135C69 124 83 126 91 139C78 149 65 147 55 135Z"/>
    <path d="M79 110C94 101 108 105 114 119C99 127 87 124 79 110Z"/>
