    <path d="M-7 0C-4-9 6-10 11-3C13 6 5 11-3 8C-9 6-11 3-7 0Z" fill="#68102e"/>
    <path d="M-2-1C1-5 7-3 7 2C5 7-2 7-4 3C-5 1-4 0-2-1Z" fill="#bd6d83"/>
